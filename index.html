<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แดชบอร์ดค่าใช้จ่าย กฟส.ด่านซ้าย (D044) & กฟส.นาแห้ว</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#F8FAFC; --ink:#0F172A; --ink-2:#475569; --ink-3:#64748B; --line:#E2E8F0;
  --brand:#5B21B6; --brand-2:#0D9488; --brand-soft:#EDE9FE; --on-brand:#FFFFFF;
  --amber:#D97706; --amber-soft:#FEF3C7; --red:#E11D48; --red-soft:#FFE4E6; --green:#059669; --green-soft:#D1FAE5;
  --fill:linear-gradient(90deg, #5B21B6, #0EA5E9, #10B981); --track:#E2E8F0; --radius:18px;
  --shadow:0 4px 20px -2px rgba(15,23,42,.05), 0 2px 6px -1px rgba(15,23,42,.03);
  --shadow-lg:0 18px 35px -8px rgba(91,33,182,.14), 0 4px 12px -2px rgba(15,23,42,.06);
  /* 7 Category Vibrant Colors */
  --c1:#6D28D9; --c1-bg:#EDE9FE;
  --c2:#0284C7; --c2-bg:#E0F2FE;
  --c3:#0D9488; --c3-bg:#CCFBF1;
  --c4:#D97706; --c4-bg:#FEF3C7;
  --c5:#E11D48; --c5-bg:#FFE4E6;
  --c6:#059669; --c6-bg:#D1FAE5;
  --c7:#4F46E5; --c7-bg:#E0E7FF;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;
  background:
    linear-gradient(180deg, #EEF2FF 0%, #F4F6FB 320px),
    var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans Thai','Sarabun','Noto Sans Thai',system-ui,sans-serif;
  font-size:15.5px;line-height:1.6;font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}
button,select,input,textarea{font:inherit;color:inherit}

/* === UNIQUE COMMAND HEADER (DISTINCT FROM VIDEO) === */
.topbar-wrap{
  background:linear-gradient(125deg, #1E1B4B 0%, #3B0764 55%, #115E59 100%);
  border-bottom:3px solid #F59E0B;
  position:sticky;top:0;z-index:40;
  box-shadow:0 10px 25px -5px rgba(30,27,75,0.25);
}
.topbar{
  max-width:1280px;margin:0 auto;
  padding:12px clamp(16px,3vw,36px);
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  flex-wrap:wrap;color:#FFFFFF;
}
.pea-logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.pea-circle{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,#F59E0B,#D97706);
  color:#1E1B4B;font-weight:800;font-size:.95rem;
  display:grid;place-items:center;
  box-shadow:0 4px 12px rgba(245,158,11,0.35);
  transform:rotate(-3deg);transition:transform .25s ease;
}
.pea-logo:hover .pea-circle{transform:rotate(0deg) scale(1.06)}
.pea-brand-txt{font-weight:700;font-size:1.15rem;color:#FFFFFF;display:flex;align-items:center;gap:8px;line-height:1.2}
.pea-brand-sub{font-size:.73rem;font-weight:600;color:#FEF3C7;background:rgba(255,255,255,0.14);padding:2px 9px;border-radius:6px;border:1px solid rgba(254,243,199,0.25)}
.pea-brand-desc{font-size:.76rem;color:#CBD5E1;display:block;margin-top:2px}

.nav-pills{
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  background:rgba(15,23,42,0.35);padding:4px;border-radius:12px;
  border:1px solid rgba(255,255,255,0.12);
}
.nav-pills button{
  all:unset;cursor:pointer;
  padding:7px 14px;border-radius:9px;
  font-size:.86rem;font-weight:500;color:#E2E8F0;
  transition:all .2s ease;
  display:inline-flex;align-items:center;gap:6px;
}
.nav-pills button:hover{color:#FFFFFF;background:rgba(255,255,255,0.1)}
.nav-pills button[aria-current="page"]{
  background:#FFFFFF;color:#1E1B4B;font-weight:700;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.unit-pill{
  background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:#FFFFFF;
  border-radius:10px;padding:6px 12px;font-size:.84rem;font-weight:600;
  cursor:pointer;transition:all .2s;
}
.unit-pill option,.unit-pill optgroup{color:#0F172A;background:#FFFFFF}
.unit-pill:hover{background:rgba(255,255,255,0.2)}
.user-badge{
  display:inline-flex;align-items:center;gap:7px;
  background:linear-gradient(135deg,#F59E0B,#EA580C);border:none;color:#FFFFFF;
  padding:7px 14px;border-radius:10px;font-weight:700;font-size:.83rem;
  cursor:pointer;transition:transform .2s, box-shadow .2s;
  box-shadow:0 4px 12px rgba(234,88,12,0.35);
}
.user-badge:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(234,88,12,0.45)}
.user-badge i{font-style:normal}

/* === MAIN CONTAINER === */
main{max-width:1260px;margin:0 auto;padding:24px clamp(16px,3vw,36px) 80px;min-width:0;animation:fadeSlide .35s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* === UNIQUE BENTO COMMAND BANNER === */
.bento-Command{
  display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-bottom:24px;
}
.bento-main{
  background:linear-gradient(135deg, #FFFFFF 0%, #F5F3FF 100%);
  border:1px solid #DDD6FE;border-radius:22px;padding:24px 26px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
}
.bento-main::after{
  content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
  border-radius:50%;background:radial-gradient(circle, rgba(139,92,246,0.14), transparent 70%);
  pointer-events:none;
}
.bm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bm-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:#EDE9FE;color:#5B21B6;font-weight:700;font-size:.78rem;
  padding:4px 12px;border-radius:8px;
}
.bm-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:#7C3AED;animation:pulseDot 1.8s infinite}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.5}}
.bm-title{margin:6px 0 2px;font-size:clamp(1.45rem,2.6vw,1.95rem);font-weight:800;color:#1E1B4B;letter-spacing:-.02em}
.bm-sub{margin:0;color:var(--ink-2);font-size:.86rem}

.bm-metrics{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  margin:16px 0;padding:14px;background:#FFFFFF;border-radius:16px;border:1px solid var(--line);
}
.bm-mcell{padding:4px 8px;border-left:3px solid #E2E8F0}
.bm-mcell.m-purple{border-left-color:#7C3AED}
.bm-mcell.m-teal{border-left-color:#0D9488}
.bm-mcell.m-amber{border-left-color:#F59E0B}
.bm-mlbl{font-size:.76rem;color:var(--ink-3);font-weight:600}
.bm-mval{font-size:clamp(1.15rem,2vw,1.45rem);font-weight:800;color:#0F172A;line-height:1.2;margin-top:2px}
.bm-mval small{font-size:.6em;font-weight:500;color:var(--ink-3);margin-left:2px}

.bm-bar-wrap{margin-top:4px}
.bm-bar-top{display:flex;justify-content:space-between;font-size:.8rem;font-weight:600;margin-bottom:5px}
.bm-bar-track{height:10px;border-radius:999px;background:#E2E8F0;overflow:hidden}
.bm-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#6D28D9,#0EA5E9,#10B981);animation:grow 1s ease}

/* === UNIQUE SPEEDOMETER GAUGE & SCORE CARD (RIGHT SIDE OF BENTO) === */
.bento-gauge{
  background:linear-gradient(145deg, #0F172A 0%, #1E1B4B 60%, #311042 100%);
  color:#FFFFFF;border-radius:22px;padding:22px 24px;
  box-shadow:0 14px 30px -6px rgba(15,23,42,0.25);
  display:flex;flex-direction:column;justify-content:space-between;
}
.bg-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bg-tag{font-size:.76rem;font-weight:700;color:#FDE047;background:rgba(253,224,71,0.14);border:1px solid rgba(253,224,71,0.3);padding:3px 10px;border-radius:8px}
.bg-center{display:flex;align-items:center;gap:18px;margin:12px 0}
.gauge-svg{width:130px;height:80px;flex-shrink:0;overflow:visible}
.gauge-bg{fill:none;stroke:rgba(255,255,255,0.14);stroke-width:12;stroke-linecap:round}
.gauge-fg{fill:none;stroke:url(#gaugeGrad);stroke-width:12;stroke-linecap:round;stroke-dasharray:157;animation:gaugeDraw 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes gaugeDraw{from{stroke-dashoffset:157}}
.bg-score-num{font-size:2.4rem;font-weight:800;line-height:1;color:#FDE047}
.bg-score-num small{font-size:.42em;color:#CBD5E1;font-weight:500}
.bg-score-lbl{font-size:.82rem;color:#E2E8F0;margin-top:4px}

.bg-mini-pills{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.bg-mpill{
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;padding:9px 12px;cursor:pointer;transition:all .2s;
}
.bg-mpill:hover{background:rgba(255,255,255,0.16);transform:translateY(-2px)}
.bg-mpill small{font-size:.72rem;color:#CBD5E1;display:block}
.bg-mpill b{font-size:.95rem;color:#FFFFFF}

/* === 7-CATEGORY MOSAIC RIBBON CARDS (ORIGINAL DESIGN, NOT 4 HOVER CLONES) === */
.mosaic-sec-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin:26px 0 14px}
.mosaic-sec-head h2{margin:0;font-size:1.25rem;font-weight:800;color:#0F172A;display:flex;align-items:center;gap:8px}
.mosaic-sec-head p{margin:0;font-size:.84rem;color:var(--ink-2)}

.mosaic-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;margin-bottom:26px;
}
.mcard{
  background:#FFFFFF;border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:var(--shadow);transition:all .24s cubic-bezier(.2,.8,.2,1);
  border-top:4px solid var(--brand);
  display:flex;flex-direction:column;justify-content:space-between;
}
.mcard:hover{
  transform:translateY(-5px) scale(1.01);
  box-shadow:0 16px 32px -8px rgba(15,23,42,0.14);
}
.mcard.mc-1{border-top-color:#7C3AED}
.mcard.mc-2{border-top-color:#0284C7}
.mcard.mc-3{border-top-color:#0D9488}
.mcard.mc-4{border-top-color:#D97706}
.mcard.mc-5{border-top-color:#E11D48}
.mcard.mc-6{border-top-color:#059669}
.mcard.mc-7{border-top-color:#4F46E5}

.mc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.mc-tag{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:6px}
.mc-1 .mc-tag{background:var(--c1-bg);color:var(--c1)}
.mc-2 .mc-tag{background:var(--c2-bg);color:var(--c2)}
.mc-3 .mc-tag{background:var(--c3-bg);color:var(--c3)}
.mc-4 .mc-tag{background:var(--c4-bg);color:var(--c4)}
.mc-5 .mc-tag{background:var(--c5-bg);color:var(--c5)}
.mc-6 .mc-tag{background:var(--c6-bg);color:var(--c6)}
.mc-7 .mc-tag{background:var(--c7-bg);color:var(--c7)}

.mc-name{font-weight:700;font-size:.96rem;color:#0F172A;margin-bottom:8px;line-height:1.3}
.mc-nums{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.mc-val{font-size:1.3rem;font-weight:800;color:#0F172A}
.mc-pct{font-size:.9rem;font-weight:700;color:var(--ink-2)}
.mc-bar{height:6px;border-radius:999px;background:#E2E8F0;overflow:hidden;margin-bottom:6px}
.mc-bar i{display:block;height:100%;border-radius:999px;transition:width .6s ease}
.mc-1 .mc-bar i{background:#7C3AED}
.mc-2 .mc-bar i{background:#0284C7}
.mc-3 .mc-bar i{background:#0D9488}
.mc-4 .mc-bar i{background:#D97706}
.mc-5 .mc-bar i{background:#E11D48}
.mc-6 .mc-bar i{background:#059669}
.mc-7 .mc-bar i{background:#4F46E5}
.mc-foot{font-size:.76rem;color:var(--ink-3);display:flex;justify-content:space-between}

/* === CENTER MODAL DIALOG FOR TARGET SIMULATOR (INSTEAD OF RIGHT DRAWER) === */
.drawer-backdrop{
  position:fixed;inset:0;background:rgba(15,23,42,0.55);
  backdrop-filter:blur(4px);z-index:90;opacity:0;pointer-events:none;
  transition:opacity .22s ease;
}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:50%;left:50%;width:min(620px,94vw);max-height:88vh;
  background:#FFFFFF;z-index:100;border-radius:24px;
  box-shadow:0 25px 60px -15px rgba(15,23,42,0.35);
  padding:26px;overflow-y:auto;
  transform:translate(-50%,-46%) scale(0.95);opacity:0;pointer-events:none;
  transition:all .25s cubic-bezier(.2,.8,.2,1);
}
.drawer.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.drawer-head h3{margin:0;font-size:1.2rem;font-weight:800;color:#1E1B4B}
.drawer-close{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:700}
.drawer-close:hover{background:var(--red-soft);color:var(--red)}

/* === FILTER BAR & PANELS === */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-bottom:22px;padding:16px 22px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow)}
.top h1{margin:0;font-size:1.45rem;font-weight:700;line-height:1.3;color:#1E1535}
.top p{margin:2px 0 0;color:var(--ink-2);font-size:.86rem}
.pick{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pick label{font-size:.84rem;color:var(--ink-2);display:flex;align-items:center;gap:6px;font-weight:600}
select,input[type=text],input[type=number]{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:38px;font-weight:500;transition:border-color .2s}
select:hover,input[type=text]:hover,input[type=number]:hover{border-color:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:20px;transition:transform .22s ease, box-shadow .22s ease}
.panel:hover{box-shadow:var(--shadow-lg)}
.panel h2{margin:0 0 4px;font-size:1.15rem;font-weight:700}
.panel .sub{margin:0 0 14px;color:var(--ink-2);font-size:.86rem}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}

.scale{display:flex;justify-content:space-between;font-size:.76rem;color:var(--ink-3)}
dl.kv{display:grid;grid-template-columns:1fr auto;gap:7px 16px;margin:14px 0 0;font-size:.9rem;padding-top:12px;border-top:1px solid rgba(128,128,128,0.18)}
dl.kv dt{color:var(--ink-2)} dl.kv dd{margin:0;text-align:right;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:.76rem;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.watch{background:var(--amber-soft);color:var(--amber)}
.chip.over{background:var(--red-soft);color:var(--red)}
.chip.none{background:var(--surface-2);color:var(--ink-3)}
.big{font-size:2rem;font-weight:700;line-height:1.2;color:var(--brand)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.neg{color:var(--red);font-weight:600}

/* ruler */
.ruler{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,var(--track) 0 76.923%,var(--red-soft) 76.923% 100%)}
.ruler.sm{height:10px;border-radius:999px}
.ruler .fill{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:linear-gradient(90deg, #7C3AED, #0EA5E9, #10B981);animation:grow .8s cubic-bezier(.2,.7,.2,1)}
.ruler .fill.watch{background:linear-gradient(90deg, #F59E0B, #EA580C)}
.ruler .fill.over{background:linear-gradient(90deg, #EF4444, #DB2777)}
.ruler .bud{position:absolute;top:-4px;bottom:-4px;left:76.923%;width:2px;background:var(--ink);border-radius:2px}
.ruler .py{position:absolute;top:50%;width:9px;height:9px;background:#FDE047;border:2px solid var(--ink);transform:translate(-50%,-50%) rotate(45deg)}
.ruler.none{background:none;height:auto;color:var(--ink-3);font-size:.85rem}
@keyframes grow{from{width:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.8rem;color:var(--ink-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-fill{width:18px;height:8px;border-radius:4px;background:linear-gradient(90deg, #7C3AED, #10B981)}
.lg-bud{width:2px;height:14px;background:var(--ink)}
.lg-py{width:8px;height:8px;border:2px solid var(--ink);transform:rotate(45deg);background:#FDE047}
.lg-over{width:18px;height:8px;border-radius:4px;background:var(--red-soft);border:1px solid var(--red)}
.rrow{display:grid;grid-template-columns:minmax(160px,1.2fr) minmax(180px,2.1fr) 66px 122px 112px 104px;gap:6px 16px;align-items:center;padding:12px 10px;border-top:1px solid var(--line);border-radius:12px;transition:background .18s, transform .18s}
.rrow:hover{background:var(--surface-2);transform:translateX(4px)}
.rrow:first-of-type{border-top:0}
.rrow.tot{background:linear-gradient(90deg, var(--brand-soft), var(--surface-2));margin:0 -10px 6px;padding:14px 14px;font-weight:600;border-radius:14px}
.rrow .nm{display:flex;align-items:center;gap:10px}
.cat-dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.cat-1{background:var(--c1-bg);color:var(--c1)}
.cat-2{background:var(--c2-bg);color:var(--c2)}
.cat-3{background:var(--c3-bg);color:var(--c3)}
.cat-4{background:var(--c4-bg);color:var(--c4)}
.cat-5{background:var(--c5-bg);color:var(--c5)}
.cat-6{background:var(--c6-bg);color:var(--c6)}
.cat-7{background:var(--c7-bg);color:var(--c7)}
.cat-0{background:var(--brand);color:#FFF}
.rrow .nm b{font-weight:600;display:block;line-height:1.35}
.rrow .nm small{color:var(--ink-3);font-size:.78rem}
.rrow .pc{text-align:right;font-weight:700;font-size:1.02rem}
.rrow .amt{text-align:right;font-weight:500}
.rrow .yoy{text-align:right;font-size:.85rem;color:var(--ink-2)}
.rrow .rem{text-align:right;font-weight:500}
.ruler .pace{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;background:#F59E0B;border-radius:2px}
.lg-pace{width:3px;height:14px;background:#F59E0B;border-radius:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface-2);padding:3px;gap:3px}
.seg button{all:unset;cursor:pointer;padding:6px 14px;font-size:.84rem;border-radius:999px;transition:all .2s}
.seg button[aria-pressed="true"]{background:#1E1535;color:#FFF;font-weight:600}
.rhead{display:grid;grid-template-columns:minmax(160px,1.2fr) minmax(180px,2.1fr) 66px 122px 112px 104px;gap:16px;font-size:.78rem;font-weight:600;color:var(--ink-3);padding:0 10px 8px}
.rhead span:nth-child(n+3){text-align:right}
/* tables */
.scroll{overflow-x:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-align:right;padding:10px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl th:first-child,.tbl th.l{text-align:left}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;transition:background .15s}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl td.l{text-align:left;white-space:normal;min-width:190px}
.tbl td.code{text-align:left;color:var(--brand);font-weight:600;font-size:.82rem}
.tbl tr.sum td{background:var(--brand-soft);font-weight:700}
.tbl tr.zero td{color:var(--ink-3)}
.tbl td.ruc{min-width:120px;padding-right:14px}
.tbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:6px 0}
.tbtn .car{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-weight:700;transition:transform .22s}
.tbtn[aria-expanded="true"] .car{transform:rotate(90deg)}
.typehead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.typehead h2{margin:0}
/* buttons */
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:38px;font-weight:600;transition:all .2s}
.btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg, #6B21A8, #8B5CF6);color:#FFF;border-color:transparent;box-shadow:0 4px 12px rgba(107,33,168,0.25)}
.btn.gold{background:linear-gradient(135deg, #F59E0B, #EA580C);color:#FFF;border-color:transparent;font-weight:700;box-shadow:0 4px 14px rgba(234,88,12,0.3)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:32px;padding:4px 12px;font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* upload */
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:30px 20px;text-align:center;background:var(--surface-2);transition:background .15s,border-color .15s}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop b{display:block;font-size:1.05rem;margin-bottom:4px}
.pend{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-top:12px;background:var(--surface)}
.pend h3{margin:0 0 6px;font-size:1rem;font-weight:600}
.checks{margin:8px 0 0;padding:0;list-style:none;font-size:.88rem}
.checks li{padding:2px 0}
.checks .ok::before{content:"✓ ";color:var(--green);font-weight:700}
.checks .warn::before{content:"! ";color:var(--amber);font-weight:700}
.checks .bad::before{content:"✕ ";color:var(--red);font-weight:700}
.yrow{padding:12px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start}
.yrow:first-of-type{border-top:0}
.snapchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;background:var(--surface-2);font-size:.84rem;margin:0 6px 6px 0}
.snapchip button{all:unset;cursor:pointer;padding:0 6px;color:var(--ink-3);border-radius:999px}
.snapchip button:hover{color:var(--red);background:var(--red-soft)}
.snapchip button.armed{color:var(--red);background:var(--red-soft);font-size:.78rem;font-weight:600}
.empty{text-align:center;padding:48px 20px;color:var(--ink-2)}
.empty h2{color:var(--ink);margin-bottom:6px}
.notice{border-radius:14px;padding:12px 16px;font-size:.86rem;margin-bottom:16px;background:var(--amber-soft);color:var(--ink)}
.notice.info{background:var(--brand-soft)}
.cols2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.cols2 .panel{margin:0}
.delta-list{list-style:none;margin:0;padding:0}
.delta-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.delta-list li:first-child{border-top:0}
.delta-list small{color:var(--ink-3)}
.mapt{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:12px}
textarea.bk{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px;font-family:ui-monospace,monospace;font-size:.75rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1E1535;color:#FFF;padding:10px 20px;border-radius:999px;font-size:.9rem;z-index:120;box-shadow:0 8px 24px rgba(0,0,0,0.2)}
#toast.err{background:var(--red);color:#fff}
svg.chart text{fill:var(--ink-2);font-size:11px;font-family:inherit}
svg.chart .grid{stroke:var(--line)}
body.present{font-size:18px}
body.present .nopres{display:none!important}
@media (max-width:900px){
  .bento-Command,.cols2{grid-template-columns:minmax(0,1fr)}
  .bm-metrics{grid-template-columns:1fr}
  .rhead{display:none}
  .rrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm pc" "rl rl" "am rm" "yy yy"}
  .rrow .nm{grid-area:nm}.rrow .ruler,.rrow .ruler.none{grid-area:rl}.rrow .pc{grid-area:pc}.rrow .amt{grid-area:am;text-align:left}.rrow .rem{grid-area:rm}.rrow .yoy{grid-area:yy}
}
</style>
</head>

function combineRows(r1, r2) {
  const m = new Map();
  [...r1, ...r2].forEach(x => {
    const o = m.get(x.c) || { c: x.c, n: x.n, g: x.g, b12: 0, bc: 0, a: 0, r: 0, s7: false };
    o.b12 = +(o.b12 + x.b12).toFixed(2);
    o.bc  = +(o.bc + x.bc).toFixed(2);
    o.a   = +(o.a + x.a).toFixed(2);
    o.r   = +(o.r + x.r).toFixed(2);
    o.s7  = o.s7 || x.s7;
    m.set(x.c, o);
  });
  return [...m.values()].sort((a, b) => a.c < b.c ? -1 : 1);
}

function scaleRows(rows, factorAct, factorBud) {
  return rows.map(x => ({
    c: x.c,
    n: x.n,
    g: x.g,
    b12: +(x.b12 * factorBud).toFixed(2),
    bc:  +(x.bc * factorBud).toFixed(2),
    a:   +(x.a * factorAct).toFixed(2),
    r:   +(x.r * factorAct).toFixed(2),
    s7:  x.s7
  }));
}

function num(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  if(v==null)return 0;
  let s=String(v).replace(/[,\s]/g,'');
  if(!s)return 0;
  let neg=false;
  if(s.endsWith('-')){neg=true;s=s.slice(0,-1);}
  const n=parseFloat(s);
  return isNaN(n)?0:(neg?-n:n);
}
const norm=s=>String(s==null?'':s).replace(/\s+/g,' ').trim();
function parseSap(aoa){
  const out={year:null,months:null,pc:null,date:null,codes:[],rows:[],secTot:{},checks:[]};
  const by=new Map();
  let cols=null,kind=null;
  for(const r of aoa){
    if(!r)continue;
    const joined=r.map(norm).join(' ');
    let m;
    if(out.year==null&&(m=joined.match(/ช่วง\s*(\d+)\s*เดือน\s*\(.*?(\d{4})\s*\)/))){out.months=+m[1];out.year=+m[2];}
    if(!out.pc&&(m=joined.match(/ศูนย์กำไร\s*(\S+)\s*ถึง\s*(\S+)/)))out.pc=m[1]+' – '+m[2];
    if(!out.date&&(m=joined.match(/วันที่\s*:\s*(\d{2}\.\d{2}\.\d{4})/)))out.date=m[1];
    if(!kind)(joined.match(/D\d{7,10}/g)||[]).forEach(c=>{if(!out.codes.includes(c))out.codes.push(c);});
    if(!out.post&&(m=joined.match(/วันที่ผ่านรายการ\s*(\d{2})\.(\d{2})\.(\d{4})\s*ถึง\s*(\d{2})\.(\d{2})\.(\d{4})/))){out.post={ey:+m[6],em:+m[5]};if(out.year==null)out.year=out.post.ey<2400?out.post.ey+543:out.post.ey;}
    const ci=r.some(c=>norm(c)==='ชื่อบัญชี')?r.findIndex(c=>norm(c)==='รหัสบัญชี'):-1;
    if(ci>=0){
      cols={code:ci};
      r.forEach((c,i)=>{const t=norm(c);if(!t)return;
        if(t==='กลุ่มรหัสบัญชี')cols.g=i;
        else if(t==='ชื่อบัญชี')cols.n=i;
        else if(t.startsWith('งบประมาณ 12 เดือน'))cols.b12=i;
        else if(t==='งบประมาณสะสม')cols.bc=i;
        else if(t==='จ่ายจริงสะสม')cols.a=i;
        else if(t==='ค่าใช้จ่ายตามเกณฑ์')cols.crit=i;
        else if(t==='ค่าใช้จ่ายยกเว้นสะสม')cols.ex=i;
        else if(t==='ค่าใช้จ่ายคงเหลือ')cols.real=i;
      });
      kind=cols.crit!=null?'kpi':(cols.real!=null?'seven':null);
      continue;
    }
    if(!cols||!kind)continue;
    const code=norm(r[cols.code]);
    if(/^\d{8}$/.test(code)){
      let rec=by.get(code);
      if(!rec){rec={c:code,n:'',g:'',b12:0,bc:0,a:0,r:0,s7:false,k:false};by.set(code,rec);}
      const nm=cols.n!=null?norm(r[cols.n]):'';
      const gp=cols.g!=null?norm(r[cols.g]):'';
      if(nm&&!rec.n)rec.n=nm;
      if(gp&&!rec.g)rec.g=gp;
      const b12=num(r[cols.b12]),bc=num(r[cols.bc]),a=num(r[cols.a]);
      const rr=kind==='kpi'?num(r[cols.crit]):num(r[cols.real]);
      if(kind==='seven')rec.s7=true;
      if(kind==='kpi'){rec.k=true;rec.b12=b12;rec.bc=bc;rec.a=a;rec.r=rr;}
      else if(!rec.k){rec.b12=b12;rec.bc=bc;rec.a=a;rec.r=rr;}
    }else if(cols.g!=null&&/^\*\*\s*ยอดรวม/.test(norm(r[cols.g]))){
      out.secTot[kind]={b12:num(r[cols.b12]),bc:num(r[cols.bc]),a:num(r[cols.a]),r:kind==='kpi'?num(r[cols.crit]):num(r[cols.real])};
    }
  }
  if(!out.pc&&out.codes.length)out.pc=out.codes.join(' – ');
  if(out.months==null&&out.post)out.months=out.post.em;
  if(out.months!=null&&out.date){
    const dp=out.date.split('.').map(Number),rm=(dp[2]+543===out.year||dp[2]===out.year)?dp[1]:null;
    if(rm&&out.months>rm){out.declared=out.months;out.months=rm;out.guess=true;}
  }
  out.rows=[...by.values()].sort((x,y)=>x.c<y.c?-1:1);
  return out;
}
const sumBy=(arr,k)=>arr.reduce((s,x)=>s+(x[k]||0),0);
function sapChecks(p,cfg){
  const res=[];

  if(p.secTot.kpi){
    const rr=p.rows.filter(x=>x.k),t=p.secTot.kpi;
    const ok=near(sumBy(rr,'bc'),t.bc)&&near(sumBy(rr,'a'),t.a)&&near(sumBy(rr,'r'),t.r);
    res.push(ok?{t:'ok',m:'ยอดรวมรายงานเกณฑ์ชี้วัดตรงกับ SAP ('+rr.length+' รหัสบัญชี)'}:{t:'bad',m:'ยอดรวมรายงานเกณฑ์ชี้วัดไม่ตรงกับแถว "ยอดรวม" ของ SAP — ตรวจว่าไฟล์ถูกตัดหรือไม่'});
  }else res.push({t:'warn',m:'ไม่พบรายงานเกณฑ์ชี้วัด (ZBUDR091 ส่วนแรก) — ค่า KPI จะคำนวณไม่ได้'});
  if(p.secTot.seven){

function compute(snap,cfg){

}

  const sc=v=>Math.min(Math.max(v/ref*100,0),130)/130*100;
  st=st||stat(r,ref);
  return '<div class="ruler '+cls+'" role="img" aria-label="ใช้ '+fp(r/ref*100)+' ของงบ สถานะ '+STAT_TXT[st]+'"><b class="fill '+st+'" style="width:'+sc(r)+'%"></b><i class="bud"></i>'+(pace>0?'<i class="pace" style="left:'+sc(pace)+'%" title="งบสะสมถึงเดือนนี้ '+fmt0(pace)+'"></i>':'')+(py!=null?'<i class="py" style="left:'+sc(py)+'%" title="ปีก่อนใช้ '+fmt0(py)+' บาท"></i>':'')+'</div>';
}
function ruler(r,bc,py,cls){return rulerGen(r,bc,py,cls,null,null);}
function yoyTxt(c,p){
  if(p==null)return '<span class="faint">—</span>';
  const d=c-p;
  if(p===0&&c===0)return '<span class="faint">เท่าเดิม</span>';
  const pc=p>0?d/p*100:null;
  const arrow=d>0?'▲':d<0?'▼':'■';
  return arrow+' '+(pc!=null?fp(Math.abs(pc)):'ใหม่')+'<br><small class="faint">'+sgn(d)+' บาท</small>';
}

function persistLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({all:S.all,cfg:S.cfg}));}catch(e){}}
function loadLocal(){
  const seed = EMBEDDED_SEED || buildInitialSeedAll();
  S.all = JSON.parse(JSON.stringify(seed.all || {}));
  S.cfg = mergeCfg(seed.cfg);
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){
      const o=JSON.parse(raw);
      if(o && o.all && Object.keys(o.all).length){
        for(const u of Object.keys(o.all)){
          S.all[u] = Object.assign({}, S.all[u]||{}, o.all[u]);
        }
      }
      if(o && o.cfg) S.cfg = mergeCfg(o.cfg);
    }
  }catch(e){}
  S.mode='local';S.loading=false;ensureSel();render();
}

function watchlist(cur,C){

   '<select data-bind="watchN" aria-label="จำนวนที่แสดง"><option value="10"'+(S.watchN===10?' selected':'')+'>แสดง 10</option><option value="20"'+(S.watchN===20?' selected':'')+'>แสดง 20</option><option value="50"'+(S.watchN===50?' selected':'')+'>แสดง 50</option></select></div></div>'+
   (hi.length?'<div class="scroll"><table class="tbl"><thead><tr><th>#</th><th class="l">บัญชี</th><th>งบสะสม</th><th>จ่ายจริงสะสม</th><th>คงเหลือ</th><th class="l">สัดส่วน</th><th>% ใช้</th></tr></thead><tbody>'+body+'</tbody></table></div>':'<p class="muted">ไม่มีบัญชีที่ใช้งบเกินเกณฑ์</p>')+'</section>';
}

  const have=R.filter(x=>x.C),sum=k=>have.reduce((s,x)=>s+x.C.total[k],0),neg=n=>fmt(n).replace(/^-/,'−');

  const line=(label,fn,cls)=>'<tr class="'+(cls||'')+'"><td class="l">'+label+'</td>'+R.map(x=>'<td>'+(x.C?fmt(fn(x.C)):'—')+'</td>').join('')+'<td>'+fmt(have.reduce((s,x)=>s+fn(x.C),0))+'</td>'+(B?'<td>'+fmt(fn(B))+'</td><td>'+sgn(fn(B)-have.reduce((q,x)=>q+fn(x.C),0),2)+'</td>':'')+'</tr>';

/* ============ branches ============ */
function sumRows(list){const m={};list.forEach(sn=>sn.rows.forEach(x=>{const o=m[x.c]||(m[x.c]={c:x.c,n:x.n,g:x.g,b12:0,bc:0,a:0,r:0,s7:false});o.b12+=x.b12;o.bc+=x.bc;o.a+=x.a;o.r+=x.r;o.s7=o.s7||x.s7;if(!o.n)o.n=x.n;}));return Object.values(m).sort((p,q)=>p.c<q.c?-1:1);}
function branchData(br,y,m){
  const id=snapId(y,m),file=snapsOf(br)[id],ds=deptsOf(br).map(d=>snapsOf(d.id)[id]).filter(Boolean);
  if(ds.length&&(!file||S.branchSrc==='sum'))return {src:'ผลรวม '+ds.length+' แผนก',snap:{rows:sumRows(ds)}};
  if(file)return {src:'ไฟล์รวมสาขา',snap:file};
  return null;
}

  const brs=S.cfg.units.filter(u=>u.kind==='branch'&&!u.hidden),id=S.year==null?'':snapId(S.year,S.month);
  if(S.year==null)return header('เทียบสาขา','')+emptyState();

  const R=brs.map(b=>{const d=branchData(b.id,S.year,S.month);return {b,d,C:d?compute(d.snap,S.cfg):null};});

  const ctl='<div class="row" style="margin-bottom:14px">'+seg+(both?'<label class="muted" style="font-size:.85rem">ยอดรวมของสาขาที่มีแผนก <select data-bind="branchSrc"><option value="file"'+(S.branchSrc==='file'?' selected':'')+'>ใช้ไฟล์รวมสาขา</option><option value="sum"'+(S.branchSrc==='sum'?' selected':'')+'>ใช้ผลรวมของแผนก</option></select></label>':'')+'</div>';
  const note=have.length<brs.length?'<div class="notice">เดือน'+MONF[S.month-1]+' '+S.year+' ยังไม่มีข้อมูลของ: '+R.filter(x=>!x.C).map(x=>esc(x.b.name)).join(', ')+' — อัปโหลดที่แท็บ “ข้อมูล”</div>':'';
  const ref=t=>Y?t.b12:t.bc;
  const stOf=t=>(Y&&(t.b12>0?t.r>t.b12:t.r>0))?'over':stat(t.r,t.bc);
  const th=R.map(x=>'<th>'+esc(x.b.name)+'</th>').join('');
  const mrow=(label,fn,cls)=>'<tr class="'+(cls||'')+'"><td class="l">'+label+'</td>'+R.map(x=>'<td>'+(x.C?fn(x.C,x.d):'—')+'</td>').join('')+'</tr>';

   '<section class="panel"><h2>ภาพรวมเทียบสาขา</h2><p class="sub">สะสม '+periodLabel(S.year,S.month)+' · หน่วย: บาท</p><div class="scroll"><table class="tbl"><thead><tr><th class="l">รายการ</th>'+th+'</tr></thead><tbody>'+
   mrow('ที่มาของข้อมูล',(C,d)=>esc(d.src))+
   mrow('งบ 12 เดือน (7 ประเภท)',C=>fmt(C.total.b12))+
   mrow('งบสะสม (7 ประเภท)',C=>fmt(C.total.bc))+
   mrow('ใช้จริง (7 ประเภท)',C=>'<b>'+fmt(C.total.r)+'</b>','sum')+
   mrow(Y?'% ใช้ของงบทั้งปี':'% ใช้ของงบสะสม',C=>fp(pctOf(C.total.r,ref(C.total))))+
   mrow('เหลือทั้งปี',C=>'<span class="'+(C.total.b12-C.total.r<0?'neg':'')+'">'+neg(C.total.b12-C.total.r)+'</span>')+
   mrow('% ผลงาน KPI',C=>fp(C.kpi.pct,2))+'</tbody></table></div></section>';
  const cols=R.map(x=>'<th>'+esc(x.b.name)+' ใช้จริง</th><th class="l" style="min-width:150px">% ของงบ'+(Y?'ทั้งปี':'สะสม')+'</th>').join('');
  const trow=(label,pick,cls)=>'<tr class="'+(cls||'')+'"><td class="l">'+label+'</td>'+R.map(x=>{if(!x.C)return '<td>—</td><td class="l">—</td>';const t=pick(x.C),p=pctOf(t.r,ref(t));return '<td>'+fmt(t.r)+'</td><td class="l"><div style="display:flex;align-items:center;gap:10px"><b style="min-width:52px;text-align:right">'+fp(p)+'</b><div style="flex:1;min-width:90px">'+rulerGen(t.r,ref(t),null,'sm',Y?t.bc:null,stOf(t))+'</div></div></td>';}).join('')+'</tr>';
  const types='<section class="panel"><h2>7 ประเภท เทียบสาขา</h2><p class="sub">แถบวัดสัดส่วนที่ใช้ต่องบของสาขานั้นเอง จึงเทียบกันได้แม้งบต่างขนาด</p><div class="scroll"><table class="tbl"><thead><tr><th class="l">ประเภท</th>'+cols+'</tr></thead><tbody>'+
   TYPES.map((t,i)=>trow('ประเภท '+t.id+' · '+t.short,C=>C.types[i])).join('')+trow('รวม 7 ประเภท',C=>C.total,'sum')+'</tbody></table></div></section>';
  return header('เทียบสาขา',esc(brs.map(b=>b.name).join(' เทียบ '))+' · สะสม '+periodLabel(S.year,S.month))+ctl+note+flatNote(have.map(x=>x.d.snap))+sum+types;
}

/* ============ compare ============ */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function compact(v){return v>=1e6?(v/1e6).toFixed(v%1e6===0?0:1)+' ล้าน':fmt0(v);}
function metricOf(snap){const C=compute(snap,S.cfg);return S.cmpMetric==='kpi'?C.kpi.pct:C.total.r;}
function lineChart(){
  const yrs=[S.year];if(S.cmpYear!=='none'&&S.cmpYear!=null)yrs.push(S.cmpYear);
  const series=yrs.map((y,i)=>({y,i,pts:monthsOf(y).map(m=>({m,v:metricOf(S.snaps[snapId(y,m)])})).filter(p=>p.v!=null)}));
  const all=series.flatMap(s=>s.pts.map(p=>p.v));
  if(!all.length)return '<p class="muted">ยังไม่มีข้อมูลสำหรับแสดงกราฟ</p>';
  const isK=S.cmpMetric==='kpi';
  const W=760,H=300,L=62,R=48,Tp=16,B=34,mx=niceMax(Math.max.apply(null,all)*1.05);
  const x=m=>L+(m-1)/11*(W-L-R),y=v=>Tp+(1-v/mx)*(H-Tp-B);
  let g='';

  const keepFilter=document.activeElement&&document.activeElement.id==='mapFilter';
  m.innerHTML=v();
  if(keepFilter){const f=$('mapFilter');if(f){f.focus();try{f.setSelectionRange(f.value.length,f.value.length);}catch(e){}}}
  bindDrop();
}
function bindDrop(){
  const d=$('drop');if(!d)return;
  ['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over');}));
  d.addEventListener('drop',e=>{if(S.readOnly)return;const fs=[...(e.dataTransfer&&e.dataTransfer.files||[])];if(fs.length)handleFiles(fs);});
}

/* ============ files (Native SAP UTF-16 .xls + Excel .xlsx) ============ */
async function readSapFileToAoa(f){
  const buf=await f.arrayBuffer();
  const u8=new Uint8Array(buf);
  // Check if UTF-16LE BOM (0xFF 0xFE) or tab-delimited text from SAP ZBUDR091
  if((u8.length>=2 && u8[0]===0xFF && u8[1]===0xFE) || (u8.length>=4 && u8[1]===0x00 && u8[3]===0x00)){
    const txt=new TextDecoder('utf-16le').decode(buf);
    const aoa=txt.split(/\r?\n/).map(line=>line.split('\t'));
    const p=parseSap(aoa);
    if(p.rows.length)return p;
  }
  // Try UTF-8 text if it contains ZBUDR091
  try{
    const txt8=new TextDecoder('utf-8').decode(buf);
    if(txt8.includes('ZBUDR091')||txt8.includes('กลุ่มรหัสบัญชี')){
      const aoa=txt8.split(/\r?\n/).map(line=>line.split('\t'));
      const p=parseSap(aoa);
      if(p.rows.length)return p;
    }
  }catch(e){}
  // Fallback to SheetJS XLSX
  if(typeof XLSX!=='undefined'){
    const wb=XLSX.read(buf,{type:'array'});
    for(const sn of wb.SheetNames){
      const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
      const p=parseSap(aoa);
      if(p.rows.length)return p;
    }
  }
  return null;
}

async function handleFiles(files){
  for(const f of files){
    try{
      const parsed=await readSapFileToAoa(f);
      if(!parsed){toast('ไม่พบรายงานงบประมาณใน '+f.name+' — ต้องเป็นไฟล์จากโปรแกรม ZBUDR091','err');continue;}
      const checks=sapChecks(parsed,S.cfg);
      if(parsed.year==null||parsed.months==null)checks.unshift({t:'warn',m:'อ่านปี/เดือนจากหัวรายงานไม่ได้ — กรุณาเลือกเอง'});
      else if(parsed.guess)checks.unshift({t:'warn',m:'ไฟล์กำหนดช่วงถึงเดือน'+MONF[(parsed.declared||12)-1]+' แต่ออกรายงานเมื่อ '+parsed.date+' — ถือเป็นข้อมูลถึงเดือน'+MONF[parsed.months-1]+' '+parsed.year+' (ตั้งต้น) กรุณาตรวจ'});
      else checks.unshift({t:'ok',m:'อ่านช่วงรายงานได้: ม.ค. – '+MON[Math.min(Math.max(parsed.months,1),12)-1]+' '+parsed.year});
      const du=S.cfg.units.find(q=>q.pcFrom&&unitCodes(q)===fileCodes(parsed));
      S.pending.push({name:f.name,parsed,checks,unit:du?du.id:S.unit,year:parsed.year||(new Date().getFullYear()+543),month:parsed.months||new Date().getMonth()+1});
    }catch(e){toast('อ่านไฟล์ '+f.name+' ไม่สำเร็จ','err');}
  }
  S.view='data';render();
}
function compactRows(rows){
  const map=S.cfg.map;
  return rows.filter(x=>x.b12||x.bc||x.a||x.r||x.s7||map[x.c]).map(x=>({c:x.c,n:x.n||nameOf(x.c),g:x.g,b12:x.b12,bc:x.bc,a:x.a,r:x.r,s7:!!x.s7}));
}
async function savePending(i){
  const p=S.pending[i];if(!p)return;
  const id=snapId(p.year,p.month);
  const data={unit:p.unit,year:p.year,month:p.month,pc:p.parsed.pc||'',date:p.parsed.date||'',source:p.name,uploadedAt:new Date().toISOString(),rows:compactRows(p.parsed.rows)};
  await putSnap(p.unit,id,data);
  S.pending.splice(i,1);
  if(S.year==null&&p.unit!==S.unit)S.unit=p.unit;
  const L0=latest();
  if(p.unit===S.unit&&(S.year==null||(L0&&L0.year===p.year&&L0.month===p.month))){S.year=p.year;S.month=p.month;S.cmpYear=p.year-1;}
  ensureSel();
  toast('บันทึก '+unitName(p.unit)+' '+periodLabel(p.year,p.month)+' แล้ว');
  render();
}
function downloadBlob(filename,text,mime){
  const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},200);
}
function doExportHtml(){
  let html='<!doctype html>\n'+document.documentElement.outerHTML;
  const payload=JSON.stringify({all:S.all,cfg:S.cfg});
  html=html.replace(/const EMBEDDED_SEED = [\s\S]*?;(\s*\/\*__SEED_DATA_END__\*\/)/, 'const EMBEDDED_SEED = '+payload+';$1');
  downloadBlob('index.html',html,'text/html;charset=utf-8');
  toast('ดาวน์โหลดไฟล์ index.html พร้อมอัปเดตขึ้น Vercel แล้ว');
}
async function doBackup(){
  const o={app:'d044-dashboard',version:2,exportedAt:new Date().toISOString(),cfg:S.cfg,all:S.all};
  const text=JSON.stringify(o);
  const L=latest();
  const fname='D044-backup-'+(L?L.year+'-'+String(L.month).padStart(2,'0'):'empty')+'.json';
  downloadBlob(fname,text,'application/json;charset=utf-8');
  toast('สำรองข้อมูลเป็นไฟล์ .json แล้ว');
}
async function doRestore(file){
  try{
    const o=JSON.parse(await file.text());
    if(!o||o.app!=='d044-dashboard'||!(o.all||o.snaps))throw new Error('bad');
    let n=0;const all=o.all||{D044:o.snaps};
    if(o.cfg)await putCfg(mergeCfg(o.cfg));
    for(const un of Object.keys(all))for(const id of Object.keys(all[un])){const s=all[un][id];if(s&&s.year&&s.month&&Array.isArray(s.rows)){await putSnap(un,id,s);n++;}}
    S.draft=null;ensureSel();toast('กู้คืน '+n+' รายการแล้ว');render();
  }catch(e){toast('ไฟล์สำรองไม่ถูกต้องหรือกู้คืนไม่สำเร็จ','err');}
}

/* ============ events ============ */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==='nav'){S.view=b.dataset.v;if(S.view==='branches'||S.view==='depts'){const bp=bestPeriod(S.view);if(bp){S.year=bp.year;S.month=bp.month;S.cmpYear=bp.year-1;}}ensureSel();render();window.scrollTo(0,0);}
  else if(a==='openCalc'){$('calcDrawer').classList.add('open');$('drawerBg').classList.add('open');}
  else if(a==='closeCalc'){$('calcDrawer').classList.remove('open');$('drawerBg').classList.remove('open');}
  else if(a==='scrollSec'){const el=$(b.dataset.sec);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(a==='cardClick'){
    const t=+b.dataset.t;
    S.view=b.dataset.v||'types';
    if(t){TYPES.forEach(x=>S.open[x.id]=(x.id===t));}else{S.open={};}
    render();window.scrollTo({top:0,behavior:'smooth'});
  }
  else if(a==='switchNh'){
    S.unit='NAHAEO';ensureSel();render();toast('สลับมาดูข้อมูล กฟส.นาแห้ว แล้ว');
  }
  else if(a==='present'){
    S.present=!S.present;render();
    try{if(S.present&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(!S.present&&document.fullscreenElement)await document.exitFullscreen();}catch(err){}
  }
  else if(a==='toggleType'){const t=+b.dataset.t;S.open[t]=S.open[t]===false;render();}
  else if(a==='openAll'){S.open={};render();}
  else if(a==='closeAll'){TYPES.forEach(t=>S.open[t.id]=false);render();}
  else if(a==='pickX')$('fileX').click();
  else if(a==='pickJ')$('fileJ').click();
  else if(a==='savePend')savePending(+b.dataset.i);
  else if(a==='dropPend'){S.pending.splice(+b.dataset.i,1);render();}
  else if(a==='del'){
    const id=b.dataset.id,un=b.dataset.unit,key=un+'|'+id;
    if(S.confirmDel===key){S.confirmDel=null;await delSnap(un,id);toast('ลบแล้ว');ensureSel();render();}
    else{S.confirmDel=key;render();setTimeout(()=>{if(S.confirmDel===key){S.confirmDel=null;render();}},4000);}
  }
  else if(a==='exportHtml')doExportHtml();
  else if(a==='backup')doBackup();
  else if(a==='saveCfg'){
    const d=mergeCfg(S.draft);
    await putCfg(d);S.cfg=d;S.draft=null;ensureSel();toast('บันทึกการตั้งค่าแล้ว');render();
  }
  else if(a==='ymode'){S.yearMode=b.dataset.m;render();}
  else if(a==='addUnit'){if(!S.draft)S.draft=mergeCfg(S.cfg);S.draft.units.push({id:'U'+Date.now().toString(36).toUpperCase(),name:'หน่วยใหม่',kind:'dept',parent:branchOf(S.unit),pcFrom:'',pcTo:''});render();}
  else if(a==='delUnit'){if(!S.draft)S.draft=mergeCfg(S.cfg);S.draft.units=S.draft.units.filter(u=>u.id!==b.dataset.uid);render();}
  else if(a==='resetDraft'){S.draft=null;render();}
  else if(a==='defaultCfg'){S.draft=defaultCfg();render();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fileX'){const fs=[...t.files];t.value='';if(fs.length)handleFiles(fs);return;}
  if(t.id==='fileJ'){const f=t.files[0];t.value='';if(f)doRestore(f);return;}
  const bind=t.dataset&&t.dataset.bind;
  if(bind){
    if(bind==='year'){S.year=+t.value;const ms=monthsOf(S.year);if(!ms.includes(S.month))S.month=ms[ms.length-1];S.cmpYear=S.year-1;}
    else if(bind==='unit'){S.unit=t.value;if(S.view==='depts'&&!deptsOf(branchOf(S.unit)).length)S.view='overview';ensureSel();}
    else if(bind==='branchSrc')S.branchSrc=t.value;
    else if(bind==='month')S.month=+t.value;
    else if(bind==='cmp')S.cmpYear=t.value==='none'?'none':+t.value;
    else if(bind==='watchScope')S.watchScope=t.value;
    else if(bind==='watchN')S.watchN=+t.value;
    else if(bind==='cmpMetric')S.cmpMetric=t.value;
    else if(bind==='hideZero')S.hideZero=t.checked;
    else if(bind==='detail')S.detail=t.checked;
    else if(bind==='mapAll')S.mapAll=t.checked;
    render();return;
  }
  if(t.dataset&&t.dataset.pend){const p=S.pending[+t.dataset.i];if(p){p[t.dataset.pend]=t.dataset.pend==='unit'?t.value:+t.value;render();}return;}
  if(t.dataset&&t.dataset.uf){
    if(!S.draft)S.draft=mergeCfg(S.cfg);
    const u=S.draft.units.find(x=>x.id===t.dataset.uid),f=t.dataset.uf;
    if(u){let v=t.type==='checkbox'?t.checked:t.value.trim();if(f==='pcFrom'||f==='pcTo')v=v.toUpperCase();if(f==='name'&&!v)v=u.name;u[f]=v;if(f==='kind'&&v==='dept'&&!u.parent)u.parent=(S.draft.units.find(x=>x.kind==='branch')||{}).id||'';}
    render();return;
  }
  if(t.dataset&&t.dataset.map){
    if(!S.draft)S.draft=mergeCfg(S.cfg);
    const v=+t.value;if(v)S.draft.map[t.dataset.map]=v;else delete S.draft.map[t.dataset.map];
    render();return;
  }
  if(t.dataset&&t.dataset.cfg){
    if(!S.draft)S.draft=mergeCfg(S.cfg);
    if(t.dataset.cfg==='exempt')S.draft.exempt=t.value.split(/[,\s]+/).map(s=>s.trim()).filter(s=>/^\d{8}$/.test(s));
    else if(t.dataset.cfg==='thr'){const n=parseFloat(t.value);if(n>0&&n<=100)S.draft.thr=n;}
    render();
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='mapFilter'){S.mapFilter=e.target.value;const b=$('mapBody');if(b)b.innerHTML=mapRowsHtml();}
});

/* ============ init ============ */
function init(){
  loadLocal();
}
window.__d044={S,parseSap,compute,sapChecks,defaultCfg,render};
init();
